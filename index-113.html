<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Игры 3 в 1</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0b18;color:#fff;font-family:sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 0%,#232766 0%,#0a0b18 62%)}
button{font-family:inherit;outline:none;border:0;padding:0;color:#fff}
svg{display:block}
#menu,#game{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column}
#menu{align-items:center;justify-content:center;padding:20px;overflow:hidden}
.fl{position:absolute;width:28px;height:28px;border-radius:7px;opacity:.16;animation:fl 8s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-34px) rotate(28deg)}}
#logo{font-size:42px;font-weight:bold;letter-spacing:1px;animation:dn .6s both}
#logo span{background:linear-gradient(90deg,#ffd54f,#ff8a65);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
#sub{color:#8a90c4;font-size:15px;margin:6px 0 26px;animation:dn .6s .1s both}
@keyframes dn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
.mb{position:relative;display:flex;align-items:center;width:100%;max-width:390px;margin:9px 0;padding:14px 16px 14px 14px;border-radius:22px;text-align:left;border:2px solid rgba(255,255,255,.08);box-shadow:0 8px 24px rgba(0,0,0,.45);transition:transform .12s;animation:up .55s both}
#m1{background:linear-gradient(135deg,#1c5c3e,#15182f 70%);animation-delay:.15s}
#m2{background:linear-gradient(135deg,#4a2f96,#15182f 70%);animation-delay:.28s}
#m3{background:linear-gradient(135deg,#8a6d12,#15182f 70%);animation-delay:.41s}
.mb:active{transform:scale(.96)}
.mb .ic{width:70px;height:70px;flex:none;border-radius:18px}
.mt{flex:1;margin-left:16px}
.mt b{display:block;font-size:27px}
.mt small{display:block;font-size:14px;color:#aab0dc;margin-top:4px}
.go{width:34px;height:34px;flex:none;border-radius:17px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
#game{display:none}
.in{animation:gin .35s ease-out}
@keyframes gin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
#bar{display:flex;align-items:center;padding:14px 10px 6px;flex:none}
#back2{display:none;width:52px;flex:none;margin:0 3px;align-items:center;justify-content:center;background:linear-gradient(#2c3170,#1b1e48);border-radius:14px;box-shadow:0 3px 0 #101230}
#back2:active{transform:translateY(3px);box-shadow:none}
#back{width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#2c3170,#1b1e48);border-radius:15px;box-shadow:0 3px 0 #101230;transition:transform .08s}
#back:active{transform:translateY(3px);box-shadow:none}
#gt{flex:1;text-align:center;font-size:26px;font-weight:bold}
#bsp{width:48px}
#stats{display:flex;padding:12px 7px 4px;flex:none}
.chip{flex:1;margin:0 3px;background:linear-gradient(#242856,#171a3b);border-radius:14px;padding:6px 4px;text-align:center;min-width:0;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.lb{display:block;font-size:10px;color:#8a90c4;letter-spacing:1px}
.chip b{display:block;font-size:21px;white-space:nowrap;overflow:hidden;margin-top:2px}
.pp{animation:pp .35s}
@keyframes pp{0%{transform:scale(1)}40%{transform:scale(1.14);color:#ffe082}100%{transform:scale(1)}}
#chl,#chn{display:none}
#chn{flex:none;width:64px;padding:4px 0}
#nx{display:block;margin:2px auto 0;width:44px;height:44px}
#wrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
#cv{display:block;border-radius:12px}
.bump{animation:bump .16s}
@keyframes bump{0%{transform:translateY(0)}35%{transform:translateY(5px)}100%{transform:translateY(0)}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
#ov{position:absolute;left:0;top:0;right:0;bottom:0;background:radial-gradient(circle,rgba(20,22,56,.94),rgba(8,9,22,.96));display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
#ov>*{animation:pop .35s both}
#ovt{font-size:32px;font-weight:bold;margin-bottom:8px;text-align:center}
#ovs{font-size:18px;color:#aab0dc;margin-bottom:18px;text-align:center;animation-delay:.05s}
.bt{min-width:240px;margin:6px;padding:16px 20px;font-size:20px;font-weight:bold;background:linear-gradient(#3a4180,#272c58);border-radius:16px;box-shadow:0 4px 0 #14173a;transition:transform .08s}
.bt:active{transform:translateY(4px);box-shadow:none}
#ovc{background:linear-gradient(#3cc48a,#22875b);box-shadow:0 4px 0 #14573a;animation-delay:.1s}
#ovr{background:linear-gradient(#6a78f0,#4552c8);box-shadow:0 4px 0 #272f85;animation-delay:.15s}
#ovm{animation-delay:.2s}
#ctrl{display:none;flex:none;height:0}
.cb{position:absolute;z-index:5;width:72px;height:72px;margin:0;border-radius:20px;background:linear-gradient(#3a4180,#272c58);box-shadow:0 4px 0 #14173a;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .05s}
.ovon .cb{display:none}
.cb.dn,.cb:active{transform:translateY(4px);box-shadow:none;filter:brightness(1.2)}
.cb svg{width:28px;height:28px;fill:#fff}
.cb span{font-size:11px;margin-top:2px;color:#e0e3ff;font-weight:bold}
#crot,.eb.rot{background:linear-gradient(#8466ff,#5c3fd6);box-shadow:0 4px 0 #34229a}
#gset{width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#2c3170,#1b1e48);border-radius:15px;box-shadow:0 3px 0 #101230}
#gset:active,#gset2:active,#mset:active{transform:translateY(3px);box-shadow:none}
#gset2{display:none;width:44px;flex:none;margin:0 3px;align-items:center;justify-content:center;background:linear-gradient(#2c3170,#1b1e48);border-radius:14px;box-shadow:0 3px 0 #101230}
#mset{position:absolute;top:14px;right:14px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#2c3170,#1b1e48);border-radius:15px;box-shadow:0 3px 0 #101230;z-index:3}
.panel{position:absolute;left:0;top:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;padding:20px;background:radial-gradient(circle,rgba(26,28,70,.98),rgba(8,9,22,.99));overflow-y:auto;touch-action:pan-y}
.panel>:first-child{margin-top:auto}
.panel>:last-child{margin-bottom:auto}
#lvp{z-index:50}#setp{z-index:60}
#edp{position:absolute;left:0;top:0;right:0;bottom:0;display:none;z-index:70;background:rgba(8,9,22,.94)}
.ph{font-size:32px;font-weight:bold;margin-bottom:6px;text-align:center}
.pd{color:#aab0dc;font-size:16px;margin-bottom:10px;text-align:center}
.pb{width:100%;max-width:330px}
#lgrid{display:flex;flex-wrap:wrap;width:330px;max-width:100%;margin:6px 0}
.lv{width:calc(33.33% - 12px);margin:6px;height:72px;border-radius:18px;font-size:32px;font-weight:bold;background:linear-gradient(#3a4180,#272c58);box-shadow:0 4px 0 #14173a}
.lv:active{transform:translateY(4px);box-shadow:none}
.lv.sel{background:linear-gradient(#a98bff,#6a3fd1);box-shadow:0 4px 0 #34229a,0 0 18px #8466ff88}
#linfo{color:#aab0dc;font-size:15px;margin:6px 0 12px;text-align:center}
#lgo{background:linear-gradient(#3cc48a,#22875b);box-shadow:0 4px 0 #14573a}
.sr{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:380px;margin:7px 0;padding:12px 16px;border-radius:16px;background:linear-gradient(#242856,#171a3b);font-size:18px;min-height:56px}
.sl{display:flex;align-items:center}
.sl b{width:50px;text-align:right;font-size:15px}
.sr input[type=range]{width:140px}
.tg{min-width:84px;padding:9px 12px;border-radius:14px;font-weight:bold;font-size:16px;background:#4a4f7a}
.tg.on{background:linear-gradient(#3cc48a,#22875b)}
.sh{width:100%;max-width:380px;color:#8a90c4;font-size:13px;letter-spacing:2px;margin:14px 0 4px}
#edf{position:absolute;border:2px dashed rgba(255,255,255,.28);border-radius:12px;color:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:20px;letter-spacing:3px}
#edc{position:absolute;left:10px;right:10px;top:10px;max-width:420px;margin:0 auto;padding:10px 12px;border-radius:18px;background:rgba(24,27,64,.93);box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:1}
.edt{font-size:18px;font-weight:bold;text-align:center}
.edh{font-size:12px;color:#aab0dc;text-align:center;margin:3px 0 6px}
.edr{display:flex;align-items:center;font-size:15px;margin:4px 0}
.edr input{flex:1;margin:0 8px}
.edr b{width:34px;text-align:right}
.edb{display:flex;margin-top:6px}
.sb{flex:1;margin:0 3px;padding:10px 4px;font-size:14px;font-weight:bold;border-radius:12px;background:linear-gradient(#3a4180,#272c58);box-shadow:0 3px 0 #14173a}
.sb:active{transform:translateY(3px);box-shadow:none}
.sb.g{background:linear-gradient(#3cc48a,#22875b);box-shadow:0 3px 0 #14573a}
.eb.sel{box-shadow:0 0 0 3px #ffd54f,0 4px 0 #14173a}
input[type=range]{accent-color:#8466ff}
</style>
</head>
<body>

<div id="menu">
  <button id="mset"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="4.7 4.7"/><circle cx="12" cy="12" r="7" fill="#fff"/><circle cx="12" cy="12" r="2.8" fill="#232766"/></svg></button>
  <div class="fl" style="left:8%;top:10%;background:#3ddc84"></div>
  <div class="fl" style="left:82%;top:7%;background:#b388ff;animation-delay:-2s"></div>
  <div class="fl" style="left:90%;top:42%;background:#edc22e;animation-delay:-4s"></div>
  <div class="fl" style="left:4%;top:50%;background:#00e5ff;animation-delay:-6s"></div>
  <div class="fl" style="left:18%;top:88%;background:#ff5252;animation-delay:-3s"></div>
  <div class="fl" style="left:76%;top:90%;background:#3d7dff;animation-delay:-5s"></div>

  <div id="logo">Игры <span>3 в 1</span></div>
  <div id="sub">Выбери игру</div>

  <button class="mb" id="m1">
    <svg class="ic" viewBox="0 0 64 64"><defs><linearGradient id="gs" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0d7a48"/><stop offset="1" stop-color="#7dffb8"/></linearGradient></defs><rect width="64" height="64" fill="#0f2a1d"/><path d="M12 44h26V26h12" stroke="url(#gs)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="51" cy="26" r="7" fill="#b6ffcf"/><circle cx="52" cy="24" r="2" fill="#0f2a1d"/><circle cx="14" cy="16" r="6" fill="#ff4d6d"/></svg>
    <div class="mt"><b>Змейка</b><small id="b1"></small></div>
    <div class="go"><svg width="16" height="16" viewBox="0 0 16 16"><polygon points="5,2 12,8 5,14" fill="#fff"/></svg></div>
  </button>

  <button class="mb" id="m2">
    <svg class="ic" viewBox="0 0 64 64"><defs><linearGradient id="gt2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d1b3ff"/><stop offset="1" stop-color="#6a3fd1"/></linearGradient><linearGradient id="gt3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7df3ff"/><stop offset="1" stop-color="#0089a3"/></linearGradient></defs><rect width="64" height="64" fill="#1a1238"/><rect x="9" y="37" width="13" height="13" rx="3" fill="url(#gt2)"/><rect x="25" y="37" width="13" height="13" rx="3" fill="url(#gt2)"/><rect x="41" y="37" width="13" height="13" rx="3" fill="url(#gt2)"/><rect x="25" y="21" width="13" height="13" rx="3" fill="url(#gt2)"/><rect x="43" y="9" width="13" height="13" rx="3" fill="url(#gt3)"/></svg>
    <div class="mt"><b>Тетрис</b><small id="b2"></small></div>
    <div class="go"><svg width="16" height="16" viewBox="0 0 16 16"><polygon points="5,2 12,8 5,14" fill="#fff"/></svg></div>
  </button>

  <button class="mb" id="m3">
    <svg class="ic" viewBox="0 0 64 64"><defs><linearGradient id="g48" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#e0a800"/></linearGradient></defs><rect width="64" height="64" fill="#2e270d"/><rect x="6" y="15" width="52" height="34" rx="9" fill="url(#g48)"/><text x="32" y="39" text-anchor="middle" font-size="19" font-weight="bold" font-family="sans-serif" fill="#3a2f00">2048</text></svg>
    <div class="mt"><b>2048</b><small id="b3"></small></div>
    <div class="go"><svg width="16" height="16" viewBox="0 0 16 16"><polygon points="5,2 12,8 5,14" fill="#fff"/></svg></div>
  </button>
</div>

<div id="game">
  <div id="bar">
    <button id="back"><svg width="24" height="24" viewBox="0 0 24 24"><polygon points="15,4 7,12 15,20" fill="#fff"/></svg></button>
    <div id="gt"></div>
    <button id="gset"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="4.7 4.7"/><circle cx="12" cy="12" r="7" fill="#fff"/><circle cx="12" cy="12" r="2.8" fill="#232766"/></svg></button>
  </div>
  <div id="stats">
    <button id="back2"><svg width="24" height="24" viewBox="0 0 24 24"><polygon points="15,4 7,12 15,20" fill="#fff"/></svg></button>
    <div class="chip" id="c1"><span class="lb">СЧЁТ</span><b id="sc">0</b></div>
    <div class="chip" id="c2"><span class="lb">РЕКОРД</span><b id="bs">0</b></div>
    <div class="chip" id="chl"><span class="lb">УР · ЛИНИИ</span><b id="lv">1 · 0</b></div>
    <div class="chip" id="chn"><span class="lb">ДАЛЕЕ</span><canvas id="nx" width="88" height="88"></canvas></div>
    <button id="gset2"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="4.7 4.7"/><circle cx="12" cy="12" r="7" fill="#fff"/><circle cx="12" cy="12" r="2.8" fill="#232766"/></svg></button>
  </div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="ov">
      <div id="ovt"></div>
      <div id="ovs"></div>
      <button class="bt" id="ovc">Продолжить</button>
      <button class="bt" id="ovr">Заново</button>
      <button class="bt" id="ovm">В меню</button>
    </div>
  </div>
  <div id="ctrl">
      <button class="cb" id="cl"><svg viewBox="0 0 24 24"><polygon points="16,4 7,12 16,20"/></svg><span>ВЛЕВО</span></button>
      <button class="cb" id="crot"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg><span>ПОВОРОТ</span></button>
      <button class="cb" id="cr"><svg viewBox="0 0 24 24"><polygon points="8,4 17,12 8,20"/></svg><span>ВПРАВО</span></button>
      <button class="cb" id="cd"><svg viewBox="0 0 24 24"><polygon points="4,8 12,17 20,8"/></svg><span>ВНИЗ</span></button>
  </div>
</div>

<div id="lvp" class="panel">
  <div class="ph" style="color:#b388ff">Тетрис</div>
  <div class="pd">Выбери уровень сложности</div>
  <div id="lgrid"></div>
  <div id="linfo"></div>
  <button class="bt pb" id="lgo">Играть</button>
  <button class="bt pb" id="lback">Назад</button>
</div>

<div id="setp" class="panel">
  <div class="ph">Настройки</div>
  <div class="sr"><span>Звук</span><button class="tg" id="tgSnd"></button></div>
  <div class="sr"><span>Громкость</span><span class="sl"><input type="range" id="rgVol" min="0" max="100" step="5"><b id="vlab"></b></span></div>
  <div class="sr"><span>Вибрация</span><button class="tg" id="tgVib"></button></div>
  <div class="sh">ТЕТРИС</div>
  <button class="bt pb" id="bEdit">Кнопки: место и размер</button>
  <button class="bt pb" id="sclose">Закрыть</button>
</div>

<div id="edp">
  <div id="edf"><span>ПОЛЕ</span></div>
  <div id="edc">
    <div class="edt">Кнопки Тетриса</div>
    <div class="edh">Перетаскивай кнопки пальцем. Нажми на кнопку, чтобы выбрать её и изменить размер.</div>
    <div class="edr"><span>Размер</span><input type="range" id="edsz" min="40" max="140" step="1"><b id="edsv"></b></div>
    <div class="edb"><button class="sb" id="edall">Все такие же</button><button class="sb" id="edrs">Сброс</button></div>
    <div class="edb"><button class="sb" id="edcn">Отмена</button><button class="sb g" id="edok">Готово</button></div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var cv = $('cv'), ctx = cv.getContext('2d'), wrap = $('wrap');
  var nctx = $('nx').getContext('2d'); nctx.scale(2, 2);
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var KEYS = ['', 'g3_snake', 'g3_tetris', 'g3_2048'];
  var NAMES = ['', 'Змейка', 'Тетрис', '2048'];
  var ACC = ['', '#3ddc84', '#b388ff', '#edc22e'];
  var PI2 = 6.2832;

  var cur = 0, over = false, ovOn = false, ovMode = '', ovTk = 0, token = 0;
  var score = 0, best = 0, stored = 0, cell = 10, CW = 0, CH = 0;
  var running = false, raf = 0, last = 0, T = 0, pauseAt = 0;
  var bgc = null, spr = [];
  var lastScore = -1, lastBest = -1;

  /* ---------- настройки и звук ---------- */
  var SET = { snd: 1, vol: 70, vib: 1 };
  (function () {
    try {
      var o = JSON.parse(localStorage.getItem('g3_set') || 'null');
      if (o) {
        if (o.snd !== undefined) SET.snd = o.snd ? 1 : 0;
        if (o.vib !== undefined) SET.vib = o.vib ? 1 : 0;
        if (isFinite(o.vol)) SET.vol = Math.max(0, Math.min(100, +o.vol));
      }
    } catch (e) {}
  })();
  function saveSet() { try { localStorage.setItem('g3_set', JSON.stringify(SET)); } catch (e) {} }
  var AC = null, master = null, nbuf = null;
  function setVol() { if (master) master.gain.value = SET.snd ? Math.pow(SET.vol / 100, 1.6) : 0; }
  function audioInit() {
    var C, d, i;
    if (!AC) {
      C = window.AudioContext || window.webkitAudioContext;
      if (!C) return false;
      try {
        AC = new C(); master = AC.createGain(); master.connect(AC.destination);
        nbuf = AC.createBuffer(1, AC.sampleRate >> 1, AC.sampleRate);
        d = nbuf.getChannelData(0);
        for (i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { AC = null; return false; }
      setVol();
    }
    if (AC.state === 'suspended' && AC.resume) { try { AC.resume(); } catch (e) {} }
    return true;
  }
  function tone(f, d, type, v, t0, f2) {
    var t = AC.currentTime + (t0 || 0), o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(v, t + 0.01);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(gn); gn.connect(master); o.start(t); o.stop(t + d + 0.03);
  }
  function noise(d, v, t0, fc) {
    var t = AC.currentTime + (t0 || 0), sr = AC.createBufferSource(), fl = AC.createBiquadFilter(), gn = AC.createGain();
    sr.buffer = nbuf; fl.type = 'lowpass'; fl.frequency.value = fc;
    gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    sr.connect(fl); fl.connect(gn); gn.connect(master); sr.start(t); sr.stop(t + d + 0.03);
  }
  function vib(ms) { if (SET.vib && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }
  var CL = [523, 659, 784, 1047, 1319];

    var W = window.innerWidth || 360, H = window.innerHeight || 640, top = 86, av = H - top - reserveOf(edL), c, fw, fh, f = $('edf');
    c = Math.max(4, Math.floor(Math.min((W - 10) / 10, (av - 10) / 20))); fw = c * 10; fh = c * 20;
    f.style.width = fw + 'px'; f.style.height = fh + 'px';
    f.style.left = Math.round((W - fw) / 2) + 'px'; f.style.top = Math.round(top + (av - fh) / 2) + 'px';
  }
  function edRefresh() {
    var i;
    for (i = 0; i < 4; i++) edEls[BIDS[i]].className = 'cb eb' + (BIDS[i] === 'crot' ? ' rot' : '') + (BIDS[i] === edSel ? ' sel' : '');
    $('edsz').value = edL[edSel].s; $('edsv').textContent = edL[edSel].s;
  }
  function edPlace() { var i; for (i = 0; i < 4; i++) posBtn(edEls[BIDS[i]], edL[BIDS[i]]); edMock(); }
  function wireEb(el, id) {
    var ox = 0, oy = 0, on = false, tid = -1;
    function down(px, py) {
      var b = edL[id]; ox = px - b.x * (window.innerWidth || 360); oy = py - b.y * (window.innerHeight || 640);
      on = true; edSel = id; edRefresh();
    }
    function move(px, py) {
      if (!on) return;
      var b = edL[id]; b.x = (px - ox) / (window.innerWidth || 360); b.y = (py - oy) / (window.innerHeight || 640);
      clampB(b); posBtn(el, b); edMock();
    }
    el.addEventListener('touchstart', function (e) {
      e.preventDefault(); if (on) return;
      var t = e.changedTouches[0]; tid = t.identifier; down(t.clientX, t.clientY);
    }, false);
    el.addEventListener('touchmove', function (e) {
      e.preventDefault();
      var i, t;
      for (i = 0; i < e.changedTouches.length; i++) { t = e.changedTouches[i]; if (t.identifier === tid) move(t.clientX, t.clientY); }
    }, false);
    el.addEventListener('touchend', function () { on = false; }, false);
    el.addEventListener('touchcancel', function () { on = false; }, false);
    el.addEventListener('mousedown', function (e) { e.preventDefault(); down(e.clientX, e.clientY); }, false);
    document.addEventListener('mousemove', function (e) { move(e.clientX, e.clientY); }, false);
    document.addEventListener('mouseup', function () { on = false; }, false);
  }
  function edBuild() {
    var i, el;
    if (edEls) return;
    edEls = {};
    for (i = 0; i < 4; i++) {
      el = document.createElement('div'); el.innerHTML = $(BIDS[i]).innerHTML;
      $('edp').appendChild(el); edEls[BIDS[i]] = el; wireEb(el, BIDS[i]);
    }
  }
  function edOpen() {
    edBuild(); edL = curLayout(); edSel = 'cl';
    $('edp').style.display = 'block'; edRefresh(); edPlace();
  }
  function edClose(save) {
    if (save) {
      custom = edL;
      try { localStorage.setItem('g3_tl', JSON.stringify(custom)); } catch (e) {}
      if (cur === 2) { applyLayout(); fit(); }
    }
    $('edp').style.display = 'none';
  }
  $('bEdit').addEventListener('click', edOpen, false);
  $('edok').addEventListener('click', function () { edClose(true); }, false);
  $('edcn').addEventListener('click', function () { edClose(false); }, false);
  $('edrs').addEventListener('click', function () { edL = defLayout(); edRefresh(); edPlace(); }, false);
  $('edall').addEventListener('click', function () {
    var s0 = edL[edSel].s, i;
    for (i = 0; i < 4; i++) { edL[BIDS[i]].s = s0; clampB(edL[BIDS[i]]); }
    edPlace();
  }, false);
  $('edsz').addEventListener('input', function () {
    var b = edL[edSel]; b.s = +this.value; clampB(b); posBtn(edEls[edSel], b); $('edsv').textContent = b.s; edMock();
  }, false);

  showMenu();
})();
</script>
</body>
</html>
